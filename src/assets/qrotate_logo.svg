<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" className="w-auto h-7">
  <defs>
    <linearGradient id="qGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="qGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Outer Equator Ring -->
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="url(#qGrad1)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6" />
  <!-- Polar Rotation Ring (Tilted Euler angle theta) -->
  <ellipse cx="50" cy="50" rx="18" ry="42" stroke="url(#qGrad1)" stroke-width="2.5" transform="rotate(-30 50 50)" />
  <!-- Secondary Rotation Axis Ring -->
  <ellipse cx="50" cy="50" rx="42" ry="24" stroke="url(#qGrad1)" stroke-width="1.8" transform="rotate(45 50 50)" opacity="0.4" />
  <!-- Outer Bloch Perimeter -->
  <circle cx="50" cy="50" r="44" stroke="url(#qGrad1)" stroke-width="1.5" stroke-dasharray="1 3" opacity="0.5" />
  <!-- Central Trapped Ion Node -->
  <circle cx="50" cy="50" r="6" fill="url(#qGrad1)" />
  <circle cx="50" cy="50" r="11" fill="url(#qGlow)" />
</svg>
